ext.textContent=(t==="spark"?"主人公の スパーク！ ":"主人公の たいあたり！ ")+d+"ダメージ！"}if(enemyHp<=0){setTimeout(()=>{btext.textContent="モクモンを倒した！";setTimeout(()=>endBattle(true),900)},450)}else enemyTurn()}function endBattle(win){inBattle=false;locked=false;guard=false;battle.classList.remove("active");field.style.display="block";msg.textContent=win?"勝利！フィールドへ戻りました。":"フィールドへ戻りました。";drawWorld()}document.querySelectorAll("[data-dir]").forEach(b=>b.addEventListener("click",()=>{const d=b.dataset.dir;move(d==="left"?-1:d==="right"?1:0,d==="up"?-1:d==="down"?1:0)}));document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>playerMove(b.dataset.move)));document.getElementById("back").addEventListener("click",()=>endBattle(false));document.addEventListener("keydown",e=>{if(inBattle)return;if(e.key==="ArrowUp"){e.preventDefault();move(0,-1)}if(e.key==="ArrowDown"){e.preventDefault();move(0,1)}if(e.key==="ArrowLeft"){e.preventDefault();move(-1,0)}if(e.key==="ArrowRight"){e.preventDefault();move(1,0)}});drawWorld()})();
